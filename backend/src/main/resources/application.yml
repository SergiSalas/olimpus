spring:
  application:
    name: olimpus
  datasource:
    url: jdbc:postgresql://localhost:5433/olimpus
    username: olimpus
    password: olimpus
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Dates always travel in UTC (ISO-8601). The phone shows them in the
    # local time of whoever is looking.
    time-zone: UTC
  servlet:
    multipart:
      # Spring's default is 1 MB, and the domain allows 5 (Photo.MAX_BYTES). With
      # the default, a photo the app considers fine was rejected by the plumbing
      # before any rule of ours ran.
      max-file-size: 5MB
      max-request-size: 6MB
  messages:
    # Texts for people live in messages.properties. Without this, a server with
    # a system locale that has its own file would answer in that language.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    # A request that does not say its language (no Accept-Language) gets
    # Spanish, the launch community's, not the language of the server machine.
    locale: es

server:
  port: 8080

olimpus:
  # Time zone of the launch community. The 4:00 (main round), 14:00 (second
  # chance) and 22:00 (closing) are computed in it.
  zone: Europe/Madrid
  rounds:
    main: "0 0 4 * * *"
    second-chance: "0 0 14 * * *"
  # Lets you run rounds by hand while developing. Must be false in the beta.
  dev-endpoints: true

logging:
  level:
    org.flywaydb: info
