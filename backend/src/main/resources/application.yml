spring:
  application:
    name: olimpus
  datasource:
    url: jdbc:postgresql://localhost:5433/olimpus
    username: olimpus
    password: olimpus
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Las fechas viajan siempre en UTC (ISO-8601). El movil las muestra
    # en la hora local de quien mira.
    time-zone: UTC

server:
  port: 8080

logging:
  level:
    org.flywaydb: info
