# Texts the person using the app reads. The code only knows the keys.
#
# This is the default language (Spanish, the launch community). To add another
# language, create messages_<lang>.properties with the same keys.
#
# Texts that receive arguments ({0}, {1}) go through java.text.MessageFormat:
# a single quote there must be written twice ('').

