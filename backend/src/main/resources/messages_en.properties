# ---------- notifications ----------
# Five and no more. They never carry what someone wrote: a notification can be
# read by whoever is holding the phone.

notice.new-match.title=You've got someone to talk to
notice.new-match.body=Today's conversation is waiting for you. It closes at 22:00.
notice.second-chance.title=Second chance
notice.second-chance.body=We've found someone for you this afternoon.
notice.new-message.title=Someone wrote to you
notice.new-message.body=You have a new message in today's conversation.
notice.closing-soon.title=Half an hour left
notice.closing-soon.body=Do you want to keep getting to know this person? Answer before 22:00.
notice.connection.title=It's a connection!
notice.connection.body=You both said yes. The chat stays open.
push-token.missing=The phone's identifier is missing.

# ---------- unlock notices ----------
# Shown inside the conversation, right after the message that earned them.

unlock.level-1=Now you can see their nickname and all their interests.
unlock.level-2=Level 2: you can now read their three questions.
unlock.level-3=You both said you want to see each other. There's their photo.
unlock.level-4=It's a connection. This chat stays open, with no closing time.

