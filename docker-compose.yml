services:
  db:
    image: postgres:17-alpine
    container_name: conocer-db
    environment:
      POSTGRES_DB: conocer
      POSTGRES_USER: conocer
      POSTGRES_PASSWORD: conocer
      # Todo el proyecto trabaja en UTC; la hora local de cada persona
      # se calcula al mostrarla, nunca se guarda.
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - conocer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conocer -d conocer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conocer-db-data:
