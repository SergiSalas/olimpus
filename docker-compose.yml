services:
  db:
    image: postgres:17-alpine
    container_name: olimpus-db
    environment:
      POSTGRES_DB: olimpus
      POSTGRES_USER: olimpus
      POSTGRES_PASSWORD: olimpus
      # Todo el proyecto trabaja en UTC; la hora local de cada persona
      # se calcula al mostrarla, nunca se guarda.
      TZ: UTC
    ports:
      # 5433 y no 5432: este equipo ya tiene un PostgreSQL propio instalado
      # en el 5432, y no lo tocamos.
      - "5433:5432"
    volumes:
      - olimpus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olimpus -d olimpus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  olimpus-db-data:
